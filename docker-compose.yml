services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        API_DOMAIN_NAME: ${API_DOMAIN_NAME}
        NEXT_PUBLIC_PATH: ${NEXT_PUBLIC_PATH}
        NEXT_PUBLIC_DOMAIN_NAME: ${NEXT_PUBLIC_DOMAIN_NAME}
        DEFAULT_THEME_COLOUR: ${DEFAULT_THEME_COLOUR}

    container_name: nldalmia-frontend

    ports:
      - "8000:8000"

    env_file:
      - .env

    volumes:
      - ./public:/app/public

    restart: unless-stopped
